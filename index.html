
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARENA REPLAY PRO | Galeria</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0b1018;
  --card: #151e2b;
  --green: #20d878;
  --text: #f4f7fb;
  --muted: #a9b5c5;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
}
header {
  padding: 24px 16px;
  text-align: center;
  background: linear-gradient(135deg, #122a23, #111a29);
  border-bottom: 1px solid #283544;
}
.logo { font-size: 25px; font-weight: 900; letter-spacing: 1px; }
.logo span { color: var(--green); }
header p { color: var(--muted); margin-bottom: 0; }
main { max-width: 1050px; margin: auto; padding: 22px 16px; }
.panel, .video-card {
  background: var(--card);
  border: 1px solid #293647;
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 16px;
}
h2 { margin-top: 0; }
label { display: block; margin-bottom: 8px; color: var(--muted); }
input, button {
  width: 100%;
  padding: 13px;
  border-radius: 9px;
  font-size: 16px;
}
input {
  background: #0b1018;
  color: white;
  border: 1px solid #39485a;
  margin-bottom: 10px;
}
button {
  border: 0;
  background: var(--green);
  color: #07140c;
  font-weight: bold;
  cursor: pointer;
}
button:disabled { opacity: .6; cursor: wait; }
.secondary {
  display: inline-block;
  width: auto;
  text-decoration: none;
  padding: 10px 14px;
  border-radius: 8px;
  background: #29394b;
  color: white;
  font-weight: bold;
  margin: 5px 5px 0 0;
}
#status { color: var(--muted); margin-top: 12px; white-space: pre-wrap; }
#videos {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
  gap: 14px;
}
.video-card { margin: 0; min-width: 0; }
video { width: 100%; border-radius: 9px; background: #000; }
.video-card h3 { font-size: 15px; overflow-wrap: anywhere; }
.meta { color: var(--muted); font-size: 13px; }
.hidden { display: none !important; }
footer {
  text-align: center;
  color: var(--muted);
  padding: 25px 12px;
  font-size: 12px;
}
</style>
</head>
<body>
<header>
  <div class="logo">ARENA <span>REPLAY PRO</span></div>
  <p>Seus lances da arena, em qualquer lugar.</p>
</header>

<main>
  <section class="panel" id="login">
    <h2>🔐 Galeria dos atletas</h2>
    <label for="password">Senha de acesso</label>
    <input id="password" type="password"
      placeholder="Digite a senha da galeria"
      autocomplete="current-password">
    <button id="enter">Entrar na galeria</button>
    <div id="loginStatus" role="status"></div>
  </section>

  <section id="gallery" class="hidden">
    <div class="panel">
      <h2>🎬 Meus replays</h2>
      <button id="refresh">Atualizar vídeos</button>
      <div id="status" role="status">Carregando...</div>
    </div>
    <div id="videos"></div>
  </section>
</main>

<footer>ARENA REPLAY PRO · Galeria de vídeos</footer>

<script>
const FUNCTION_URL =
  "https://okvwbdmhdiaphsgfhdeg.supabase.co/functions/v1/list-replays";

const login = document.getElementById("login");
const gallery = document.getElementById("gallery");
const passwordInput = document.getElementById("password");
const enterButton = document.getElementById("enter");
const loginStatus = document.getElementById("loginStatus");
const statusBox = document.getElementById("status");
const videosBox = document.getElementById("videos");
const refreshButton = document.getElementById("refresh");

let galleryPassword = "";

enterButton.addEventListener("click", enterGallery);
passwordInput.addEventListener("keydown", event => {
  if (event.key === "Enter") enterGallery();
});
refreshButton.addEventListener("click", loadVideos);

async function enterGallery() {
  const value = passwordInput.value;

  if (!value) {
    loginStatus.textContent = "Digite a senha para continuar.";
    return;
  }

  enterButton.disabled = true;
  loginStatus.textContent = "Verificando senha...";

  try {
    const response = await fetch(FUNCTION_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: value })
    });

    const result = await response.json();

    if (!response.ok) {
      throw new Error(
        response.status === 401
          ? "Senha incorreta. Tente novamente."
          : (result.error || "Não foi possível entrar.")
      );
    }

    galleryPassword = value;
    login.classList.add("hidden");
    gallery.classList.remove("hidden");
    videosBox.replaceChildren();
    renderVideos(result.items || []);

    statusBox.textContent = (result.items || []).length
      ? "Replays carregados."
      : "Nenhum vídeo encontrado.";
  } catch (error) {
    loginStatus.textContent = error.message || "Erro de conexão.";
  } finally {
    enterButton.disabled = false;
  }
}

async function loadVideos() {
  refreshButton.disabled = true;
  statusBox.textContent = "Buscando novos vídeos...";
  videosBox.replaceChildren();

  try {
    const response = await fetch(FUNCTION_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: galleryPassword })
    });

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.error || "Falha ao buscar vídeos.");
    }

    renderVideos(result.items || []);

    statusBox.textContent = result.items?.length
      ? `${result.items.length} vídeo(s) encontrado(s).`
      : "Nenhum vídeo encontrado.";
  } catch (error) {
    statusBox.textContent = error.message || "Erro de conexão.";
  } finally {
    refreshButton.disabled = false;
  }
}

function renderVideos(items) {
  videosBox.replaceChildren();

  for (const item of items) {
    const card = document.createElement("article");
    card.className = "video-card";

    const name = item.name || "Replay";
    const cameraMatch = name.match(/CAM[12]/i);
    const camera = cameraMatch
      ? cameraMatch[0].toUpperCase()
      : "Vídeo";

    const readableName = name.replace(/^[0-9a-f-]{36}_/i, "");

    const title = document.createElement("h3");
    title.textContent = `${camera} · ${readableName}`;

    const meta = document.createElement("p");
    meta.className = "meta";
    meta.textContent = `Data: ${item.date || "Não informada"}`;

    const player = document.createElement("video");
    player.controls = true;
    player.preload = "none";
    player.playsInline = true;
    player.src = item.url;

    const watchLink = document.createElement("a");
    watchLink.className = "secondary";
    watchLink.href = item.url;
    watchLink.target = "_blank";
    watchLink.rel = "noopener";
    watchLink.textContent = "Abrir vídeo";

    const downloadLink = document.createElement("a");
    downloadLink.className = "secondary";
    downloadLink.href = item.url;
    downloadLink.target = "_blank";
    downloadLink.rel = "noopener";
    downloadLink.textContent = "Baixar vídeo";
    downloadLink.setAttribute("download", readableName);

    card.append(title, meta, player, watchLink, downloadLink);
    videosBox.append(card);
  }
}
</script>
</body>
</html>
